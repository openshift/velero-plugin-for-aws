---
name: "Auto Request Review"

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-request-review:
    name: Auto Request Review
    # Reviewers in .github/auto-assignees.yml are upstream maintainers, not collaborators of this repo, so the job fails here.
    if: github.repository == 'velero-io/velero-plugin-for-aws'
    runs-on: ubuntu-latest
    steps:
      - name: Request a PR review based on files types/paths, and/or groups the author belongs to
        uses: necojackarc/auto-request-review@v0.7.0
        with:
          config: .github/auto-assignees.yml
          token: ${{ secrets.GITHUB_TOKEN }}
